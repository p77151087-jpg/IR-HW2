<style>
#hw2-zipf-reading-guide { position:relative; }
#hw2-zipf-reading-guide .zipf-panels { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
#hw2-zipf-reading-guide .zipf-plot { min-width:0; }
#hw2-zipf-reading-guide .zipf-chart { display:block; width:100%; overflow:visible; }
#hw2-zipf-reading-guide .zipf-chart text { fill:var(--foreground); font-size:12px; }
#hw2-zipf-reading-guide .zipf-chart .domain, #hw2-zipf-reading-guide .zipf-chart .tick line { stroke:var(--border); }
#hw2-zipf-reading-guide .tooltip { position:absolute; pointer-events:none; background:var(--popover); color:var(--popover-foreground); padding:8px; }
#hw2-zipf-reading-guide .zipf-selection { margin-top:10px; overflow-wrap:anywhere; }
@media(max-width:620px) { #hw2-zipf-reading-guide .zipf-panels { grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById('hw2-zipf-reading-guide');
  const rows = JSON.parse(document.getElementById('hw2-zipf-reading-data').textContent).map((r,i)=>({rank:i+1,term:r[0],cf:r[1]}));
  const detail = root.querySelector('.zipf-selection');
  const tooltip = root.querySelector('.tooltip');
  const number = new Intl.NumberFormat('zh-TW');
  let selection = 44;
  const views=[];
  function select(index, persist=false) {
    selection=Math.max(0,Math.min(rows.length-1,index));
    const d=rows[selection];
    detail.textContent=`${d.term}：第 ${number.format(d.rank)} 名，出現 ${number.format(d.cf)} 次`;
    views.forEach(v=>v.dot.attr('cx',v.x(v.log?Math.log10(d.rank):d.rank)).attr('cy',v.y(v.log?Math.log10(d.cf):d.cf)));
    if(persist && window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{term:d.term,rank:d.rank,cf:d.cf,condition:'B'},privateContent:{selection}}).catch(()=>{});
  }
  function draw() {
    views.length=0;
    root.querySelectorAll('.zipf-plot').forEach(container=>{
      const log=container.dataset.mode==='log';
      const width=container.getBoundingClientRect().width;
      const height=280, left=66, right=16, top=14, bottom=57;
      const xValue=d=>log?Math.log10(d.rank):d.rank;
      const yValue=d=>log?Math.log10(d.cf):d.cf;
      const domain=values=>{
        const [min,max]=d3.extent(values), pad=(max-min)*.025;
        return [log?min-pad:Math.max(0,min-pad),max+pad];
      };
      const x=d3.scaleLinear().domain(domain(rows.map(xValue))).range([left+5,width-right-5]);
      const y=d3.scaleLinear().domain(domain(rows.map(yValue))).range([height-bottom-5,top+5]);
      const svg=d3.select(container).selectAll('svg').data([null]).join('svg').attr('class','zipf-chart').attr('viewBox',`0 0 ${width} ${height}`).attr('role','img').attr('aria-label',log?'相同詞頻的 log10 圖：長尾展開，橫軸與縱軸每增加一代表原值乘十。':'原始詞頻圖：少數詞非常常見，大量詞集中在接近零的長尾。');
      svg.selectAll('*').remove();
      svg.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',Math.max(0,width-left-right)).attr('height',height-top-bottom).attr('fill','none').attr('stroke','var(--border)');
      const format=log?d3.format('.0f'):d=>number.format(d);
      const xticks=log?[0,1,2,3,4].filter((_,i)=>width>=350||i%2===0):x.ticks(3);
      svg.append('g').attr('transform',`translate(0,${height-bottom})`).call(d3.axisBottom(x).tickValues(xticks).tickFormat(format));
      svg.append('g').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(format));
      svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+width-right)/2).attr('y',height-9).attr('text-anchor','middle').text(log?'log10（排名）':'詞的排名（名次）');
      svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(14,${(top+height-bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text(log?'log10（出現次數）':'出現次數 CF（次）');
      svg.append('path').datum(rows).attr('d',d3.line().x(d=>x(xValue(d))).y(d=>y(yValue(d)))).attr('fill','none').attr('stroke','var(--viz-series-1)').attr('stroke-width',1.8);
      const dot=svg.append('circle').attr('r',5).attr('fill','var(--viz-series-1)');
      views.push({dot,x,y,log});
      const locate=event=>{
        const [px]=d3.pointer(event,svg.node());
        const rank=log?10**x.invert(px):x.invert(px);
        return d3.bisector(d=>d.rank).center(rows,rank);
      };
      svg.append('rect').attr('data-chart-hit','').attr('x',left).attr('y',top).attr('width',Math.max(0,width-left-right)).attr('height',height-top-bottom).attr('fill','transparent')
        .on('pointermove',event=>{
          const index=locate(event), d=rows[index];
          select(index);
          tooltip.textContent=`${d.term} · 第 ${number.format(d.rank)} 名 · ${number.format(d.cf)} 次`;
          tooltip.hidden=false;
          const box=root.getBoundingClientRect();
          tooltip.style.left=`${Math.max(0,Math.min(event.clientX-box.left+8,box.width-tooltip.offsetWidth))}px`;
          tooltip.style.top=`${Math.max(0,event.clientY-box.top-tooltip.offsetHeight-12)}px`;
        }).on('pointerleave',()=>{tooltip.hidden=true;}).on('click',event=>select(locate(event),true));
      // Axis labels use a small fixed tick count; remove colliding secondary ticks.
      let last=null;
      svg.selectAll('g').filter(function(){return this.getAttribute('transform')===`translate(0,${height-bottom})`;}).selectAll('.tick text').each(function(){
        const box=this.getBoundingClientRect();
        if(last && box.left<last.right+4) this.parentNode.remove(); else last=box;
      });
    });
    select(selection);
  }
  function restore(state) {
    if(Number.isInteger(state?.privateContent?.selection)) selection=state.privateContent.selection;
    select(selection);
  }
  if(window.openai?.widgetState) restore(window.openai.widgetState);
  window.addEventListener('openai:set_globals',event=>{
    if(event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
  });
  new ResizeObserver(draw).observe(root.querySelector('.zipf-panels'));
  draw();
})();
</script>
